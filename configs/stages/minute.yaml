# H-MINUTE development profile (153). Accepted ADR-002/003/004/005 unchanged.
# Gate thresholds apply per minute; cross-family comparisons use daily Sharpe.
version: minute_stage_v1
horizon_family: H-MINUTE
interval: 1m
feature_set_version: v1
splits:
  periods_per_year: 525600
  embargo_days: 1
  train: {start: 2024-09-01, end: 2025-08-31}
  valid: {start: 2025-09-02, end: 2026-02-28}
  test: {start: 2026-03-02, end: 2026-08-31}
gates:
  version: gates_v1
  sharpe_min: 1.0
  fitness_min: 1.0
  fitness_turnover_floor: 0.125
  turnover_min: 0.01
  turnover_max: 0.70
  require_out_of_sample: true
  stability_subperiod: month
  stability_min_positive_fraction: 0.5
  cost_stress_multiplier: 2.0
  cost_stress_sharpe_min: 0.0
